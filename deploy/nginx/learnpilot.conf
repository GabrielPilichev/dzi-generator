# LearnPilot - Nginx site template; see docs/DEPLOYMENT.md (Nginx, HTTPS).
# Replace learnpilot.example.com. This file is HTTP-only on purpose:
# `certbot --nginx -d learnpilot.example.com` later adds the TLS listener,
# certificate paths and the HTTP->HTTPS redirect to the second server block.
# Install as /etc/nginx/sites-available/learnpilot and remove the stock
# "default" site (it is also a default_server).

# Only POSTs consume the buckets keyed by this map. A classroom may share one
# school NAT, so the quiz/upload bursts allow simultaneous student actions.
map $request_method $learnpilot_post_client {
    default "";
    POST $binary_remote_addr;
}
# Account sign-in: a whole class behind one school NAT may sign in at once, so
# this is about 1 r/s with a class-sized burst. Per-email guessing is throttled
# in the application (login_throttle).
limit_req_zone $learnpilot_post_client zone=lp_login:1m rate=1r/s;
limit_req_zone $learnpilot_post_client zone=lp_quiz_write:1m rate=20r/s;
limit_req_zone $learnpilot_post_client zone=lp_upload:1m rate=2r/s;
# Google sign-in: one POST to start and one GET back per person, and a class
# behind one NAT produces thirty of each within a minute. The callback is a GET,
# so its zone is keyed for every method. Every limit is "nodelay": queued, the
# thirtieth student's callback would wait half a minute on a blank page.
limit_req_zone $learnpilot_post_client zone=lp_oidc_start:1m rate=1r/s;
limit_req_zone $binary_remote_addr zone=lp_oidc_callback:1m rate=1r/s;
# Registration (docs/DEPLOYMENT.md, section 33): every submission and resend sends an
# email, so the refill is two a minute; the burst lets a class behind one NAT through
# at once and does not spread its mail work out. Keyed like lp_login (POSTs only), on
# the same client address, which is only as trustworthy as the one proxy hop in front
# of the application. Proposed values (design 3.2), to be tuned on a classroom-sized
# run before activation; per-address and total caps are the application's.
limit_req_zone $learnpilot_post_client zone=lp_register:1m rate=2r/m;

# Access-log line for the OAuth callback: the path without its query string, which
# carries the authorization code and the state. The limit and upstream statuses
# keep a refused or failed callback visible now that it ends as a redirect.
log_format lp_no_args '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent lr=$limit_req_status up=$upstream_status';

# Unknown host names are dropped, so Host/X-Forwarded-Host stay trustworthy.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name learnpilot.example.com;

    server_tokens off;
    limit_req_status 429;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Must stay just above the application's request-wide limit
    # (src/practical_uploads.py MAX_REQUEST_BYTES = 4 x 25 MiB files + 1 MiB of
    # multipart overhead = 101 MiB, enforced by Flask MAX_CONTENT_LENGTH), so a
    # request the app accepts is never rejected here. Change both together.
    client_max_body_size 102m;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # Exactly one trusted hop (web.production.trusted_proxy): overwrite, never
    # append, client-supplied forwarding headers.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_redirect off;

    # Buffer whole requests/responses so slow clients never occupy the single
    # sync Gunicorn worker. Read timeout exceeds Gunicorn's 30 s worker timeout.
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_connect_timeout 5s;
    proxy_send_timeout 35s;
    proxy_read_timeout 35s;

    # Hidden files are never served (ACME challenges stay reachable for Certbot).
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Flask's static folder, served directly. Assets are not fingerprinted, so
    # cache briefly; Nginx revalidates with ETag/Last-Modified.
    location /static/ {
        alias /opt/learnpilot/app/web/static/;
        expires 1h;
        access_log off;
    }

    location = /favicon.ico {
        alias /opt/learnpilot/app/web/static/img/brand/favicon.ico;
        expires 1d;
        access_log off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    location = /login {
        limit_req zone=lp_login burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Admin second factor; code guessing is throttled per account in the application.
    location = /login/totp {
        limit_req zone=lp_login burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Google sign-in (docs/DEPLOYMENT.md, section 29). The routes exist whether or
    # not the provider is enabled; disabled, the application answers 404.
    location = /auth/google/start {
        limit_req zone=lp_oidc_start burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /auth/google/link {
        limit_req zone=lp_oidc_start burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # The confirmation carries the account's password: the sign-in budget.
    location = /auth/google/link/confirm {
        limit_req zone=lp_login burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Registration (docs/DEPLOYMENT.md, section 33). The routes exist whether or not
    # registration is enabled; disabled, the application answers 404. Submissions and
    # resends send mail: the lp_register budget. The code form is a guess at a
    # credential: the sign-in budget. No registration value is in a query string.
    #
    # Every address under /register answers with exactly one Referrer-Policy,
    # "no-referrer": add_header here replaces the server-level headers (so the other
    # two are repeated, as at the Google callback) and proxy_hide_header drops the
    # application's own copy, so the server-level strict-origin-when-cross-origin and
    # the upstream value never travel together. /register and /register/cancel
    # (a POST the application does not rate-limit) have no budget of their own, so the
    # prefix block below, which also answers any unknown path under /register/, carries
    # no limit_req, as `location /` did before.
    location = /register/student {
        limit_req zone=lp_register burst=90 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /register/teacher {
        limit_req zone=lp_register burst=90 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /register/resend {
        limit_req zone=lp_register burst=90 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /register/verify {
        limit_req zone=lp_login burst=40 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /register {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:8000;
    }

    location /register/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:8000;
    }

    # The callback address carries the code and the state in its query string.
    # Nothing at this address is ever logged with that string or answered with a
    # document: every error status, whether Nginx produced it (429 from the limit,
    # 502 and 504 from the upstream) or the application did, becomes a redirect to
    # a page without secrets. The application's own redirects pass through.
    # add_header here replaces the inherited headers, so they are repeated.
    location = /auth/google/callback {
        limit_req zone=lp_oidc_callback burst=40 nodelay;
        access_log /var/log/nginx/access.log lp_no_args;
        error_log /dev/null emerg;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_intercept_errors on;
        error_page 400 403 404 405 429 500 502 503 504 = @oidc_leave;
        proxy_pass http://127.0.0.1:8000;
    }

    # A named location: error_page with a path would serve the sign-in page's
    # content at the callback address.
    location @oidc_leave {
        access_log /var/log/nginx/access.log lp_no_args;
        error_log /dev/null emerg;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        return 302 /login?google=unavailable;
    }

    # Retired numeric student entry: the application answers 404 for every such
    # URL. The limit stays as defense in depth, so POSTs to old links or id
    # probing cannot reach the worker faster than a real quiz start.
    location ~ ^/quiz/[0-9]+$ {
        limit_req zone=lp_quiz_write burst=90 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Student entry by public token (43 URL-safe characters): the only one.
    location ~ ^/quiz/s/[A-Za-z0-9_-]+$ {
        limit_req zone=lp_quiz_write burst=90 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/quiz/attempt/[0-9]+$ {
        limit_req zone=lp_quiz_write burst=90 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/quiz/attempt/[0-9]+/practical/[^/]+/task/[0-9]+/upload$ {
        limit_req zone=lp_upload burst=45 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
