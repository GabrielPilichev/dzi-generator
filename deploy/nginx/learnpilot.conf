# LearnPilot - Nginx site template; see docs/DEPLOYMENT.md (Nginx, HTTPS).
# Replace learnpilot.example.com. This file is HTTP-only on purpose:
# `certbot --nginx -d learnpilot.example.com` later adds the TLS listener,
# certificate paths and the HTTP->HTTPS redirect to the second server block.
# Install as /etc/nginx/sites-available/learnpilot and remove the stock
# "default" site (it is also a default_server).

# Unknown host names are dropped, so Host/X-Forwarded-Host stay trustworthy.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name learnpilot.example.com;

    server_tokens off;

    # Must stay just above the application's request-wide limit
    # (src/practical_uploads.py MAX_REQUEST_BYTES = 4 x 25 MiB files + 1 MiB of
    # multipart overhead = 101 MiB, enforced by Flask MAX_CONTENT_LENGTH), so a
    # request the app accepts is never rejected here. Change both together.
    client_max_body_size 102m;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # Exactly one trusted hop (web.production.trusted_proxy): overwrite, never
    # append, client-supplied forwarding headers.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_redirect off;

    # Buffer whole requests/responses so slow clients never occupy the single
    # sync Gunicorn worker. Read timeout exceeds Gunicorn's 30 s worker timeout.
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_connect_timeout 5s;
    proxy_send_timeout 35s;
    proxy_read_timeout 35s;

    # Hidden files are never served (ACME challenges stay reachable for Certbot).
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Flask's static folder, served directly. Assets are not fingerprinted, so
    # cache briefly; Nginx revalidates with ETag/Last-Modified.
    location /static/ {
        alias /srv/learnpilot/app/web/static/;
        expires 1h;
        access_log off;
    }

    location = /favicon.ico {
        alias /srv/learnpilot/app/web/static/img/brand/favicon.ico;
        expires 1d;
        access_log off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
